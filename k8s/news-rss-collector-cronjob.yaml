apiVersion: batch/v1
kind: CronJob
metadata:
  name: news-rss-collector
spec:
  # 뉴스랩 정기 수집·분석 중지. 이미 실행 중인 Job은 별도로 확인한다.
  suspend: true
  schedule: "0 3 * * *"
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: news-rss-collector
        spec:
          restartPolicy: Never
          nodeSelector:
            workload: app
          containers:
          - name: news-rss-collector
            image: seocj/news-api:519c51aa258941f169e023422a625402c86aa3d1
            imagePullPolicy: Always
            command: ["python", "scripts/collect_rss.py"]
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: news-api-secret
                  key: DATABASE_URL
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
