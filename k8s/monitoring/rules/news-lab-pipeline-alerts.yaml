apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: news-lab-pipeline-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: news-lab.pipeline.operations
      rules:
        # 정기 수집·분석 경보는 중지하되 공용 마스터·워커 장애 경보는 유지한다.
        - alert: NewsLabNodeNotReady
          expr: |
            kube_node_status_condition{
              condition="Ready",
              status="true",
              node=~"arm-master-node|arm-worker-node"
            } == 0
          for: 10m
          labels:
            alert_scope: news-lab
            severity: critical
          annotations:
            summary: NewsLab Kubernetes Node가 NotReady 상태임
            description: >-
              {{ $labels.node }}의 Ready=true condition이 10분간 0으로 유지됐습니다.
